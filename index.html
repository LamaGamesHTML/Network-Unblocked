<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Unblocked</title>
  <style>
    body {
      background: white;
      color: black;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin: 20px 0;
    }

    .games-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .game-card {
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-decoration: none;
      color: black;
      overflow: hidden;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .game-card .title {
      padding: 10px;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>🎮 Network Unblocked</h1>
  <div class="games-container">
    
    <a class="game-card" href="games/papas-pizzeria/papas-pizzeria.html">
      <img src="assets/papaspizzeriaicon.jpeg" alt="icon">
      <div class="title">Papa's Pizzeria</div>
    </a>

    <a class="game-card" href="games/papas-pizzeria/papas-pizzeria.html">
      <img src="assets/papasburgeriaicon.jpeg" alt="icon">
      <div class="title">Papa's Burgeria</div>
    </a>
</body>
</html>
